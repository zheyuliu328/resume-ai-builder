name: Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-pip-audit:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tool
        run: |
          python -m pip install -U pip
          pip install pip-audit

      - name: Audit (from pinned requirements.txt)
        run: |
          pip-audit -r requirements.txt

  node-npm-audit:
    name: Node (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Audit (prod deps only)
        run: npm audit --omit=dev --audit-level=high
