name: Lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install -U pip
          pip install ruff black

      - name: Ruff (compiler only)
        run: ruff check src/resume_compiler tests

      - name: Black (check, compiler only)
        run: black --check src/resume_compiler tests
